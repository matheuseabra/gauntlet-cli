[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "gauntlet"
version = "0.1.0"
description = "Deterministic quality gates for agent-generated code."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["edn-format>=0.7.5,<0.8"]

[project.scripts]
gauntlet = "gauntlet.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "coverage>=7,<8", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 12
